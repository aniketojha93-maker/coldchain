        <title>Tracking of shipment 8</title>
        <link rel="stylesheet" href="unit8.css">

    <body>
    <p><a href="index.html">&larr; Back to Dashboard</a></p>
    <h2 style = "color: rgb(105, 13, 211); font-size:xx-large;">Shipment Tracking</h2>

    <div class="track">

    <div class="event">
        <span style="color: green; font-size: 20px;">&#10004; </span><h4 style="display:inline;">Order Placed</h4>
        <p>22 Nov, 09:00 AM</p>
    </div>

    <div class="event">
        <span style="color: green; font-size: 20px;">&#10004; </span><h4 style="display:inline;">Picked Up</h4>
        <p>25 Nov, 10:30 AM</p>
    </div>

    <div class="event">
        <span style="color: red; font-size: 20px;">&#10060; </span><h4 style="display:inline;">In Transit</h4>
        <p>Temperature out of Permitted Range</p>
    </div>

    <div class="eventpending">
        <span style="color: red; font-size: 20px;">&#10060; </span><h4 style="display:inline;">Delivered</h4>
        <p>Critical</p>
    </div>
    </div>
    </body>
</html>
