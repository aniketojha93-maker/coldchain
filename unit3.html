    <h3 style = "color: rgb(105, 13, 211); font-size:xx-large;">Shipment Tracking</h3>
    <div class="track">
    <div class="event">
        <span style="color: green; font-size: 20px;">&#10004; </span><h4 style="display:inline;">Order Placed</h4>
        <p>10 Nov, 8:00 AM</p>
    </div>
    <div class="event">
        <span style="color: green; font-size: 20px;">&#10004; </span><h4 style="display:inline;">Picked Up</h4>
        <p>12 Nov, 12:00 PM</p>
    </div>
    <div class="event">
        <span style="color: red; font-size: 20px;">&#10060; </span><h4 style="display:inline; color: red;">In transit</h4>
        <p>Temperature out of Permitted Range</p>
    </div>
    <div class="event">
        <span style="color: red; font-size: 20px;">&#10060; </span><h4 style="display:inline; color: red;">Delivered</h4>
        <p>Alert</p>
    </div>
    </div>
